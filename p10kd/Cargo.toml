[package]
name = "p10kd"
version = "0.1.0"
edition = "2021"
description = "Shared daemon that samples machine facts for powerlevel10k async prompt segments"
license = "MIT"
publish = false

[dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-core-wlan = { version = "0.3", default-features = false, features = ["std", "CWWiFiClient", "CWInterface", "CoreWLANTypes"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
libc = "0.2"
